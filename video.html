<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂Card🎂</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' fill='%23ff6b81' viewBox='0 0 16 16'><path d='m7.868 1.258-.2-.35a.5.5 0 0 0-.868 0l-.2.35C6.305 1.782 6 2.296 6 3c0 .828.672 1.5 1.5 1.5S9 3.828 9 3c0-.704-.305-1.218-.601-1.742zM4 6.5A1.5 1.5 0 0 1 5.5 5h5A1.5 1.5 0 0 1 12 6.5V8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6.5z'/><path d='M2 11.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 .5.5v1a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12.5v-1z'/></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🌟 เติมคลาส open เข้าไปเลย เพื่อให้ซองเปิดรอไว้ตั้งแต่แรก -->
    <div class="envelope-wrapper video-envelope-wrapper open" id="envelopeWrapper">
        <div class="envelope" id="envelope">
            <div class="flap"></div>
            
            <div class="letter-stack">
                <div class="letter-card active-card" onclick="handleCardClick(event, this)">
                    
                    <video id="myVideo" class="fade-item" controls playsinline>
                        <source src="video1.mp4" type="video/mp4">
                        เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
                    </video>

                    <div class="message-box">
                        <p class="fade-item">"ขอให้พี่มายด์ของซีแพคคนนี้มีความสุขทุกๆวัน❤️<br>เมื่อเจออุปสรรคก็ขอให้ข้ามผ่านมันไปให้ได้นะ😊<br>ซีแพคคนนี้จะอยู่ดูแลอยู่ข้างๆพี่มายด์ของเค้าไปจนแก่เฒ่าเลย" 👨‍🦳👩‍🦳</p>
                    </div>
                    
                </div>
            </div>

            <div class="pocket"></div>
        </div>
    </div>

    <script>
        // ไม่ต้องมีโค้ดเปิดซองแล้ว เพราะซองเปิดอยู่แล้ว
        function handleCardClick(event, card) {
            // ถ้าผู้ใช้กดที่ตัววิดีโอเพื่อดู (Play/Pause) จะไม่ทำให้จดหมายปลิว
            if (event.target.tagName.toLowerCase() === 'video') {
                return; 
            }

            event.stopPropagation();
            card.classList.add("fly-away");

            // เมื่อจดหมายปลิวออกไป ให้เปลี่ยนหน้าไป game.html
            setTimeout(() => {
                window.location.href = "game.html";
            }, 600);
        }
    </script>
</body>
</html>
