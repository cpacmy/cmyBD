<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂Card🎂</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <div class="book-container">
        <!-- ใส่คลาส page-enter เพื่อให้มี animation พลิกเปิดตอนเริ่มเข้าหน้า -->
        <div class="book-page page-enter" id="bookPage">
            <video id="myVideo" class="fade-item" controls playsinline muted>
                <source src="video1.mp4" type="video/mp4">
                เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
            </video>

            <p class="fade-item">"ขอให้พี่มายด์ของซีแพคคนนี้มีความสุขทุกๆวัน❤️<br>เมื่อเจออุปสรรคก็ขอให้ข้ามผ่านมันไปให้ได้นะ😊<br>ซีแพคคนนี้จะอยู่ดูแลอยู่ข้างๆพี่มายด์ของเค้าไปจนแก่เฒ่าเลย" 👨‍🦳👩‍🦳</p>
            
            <!-- เพิ่มปุ่มย้อนกลับไปหน้า index.html -->
            <div class="nav-buttons fade-item">
                <a href="#" onclick="goToPage('index.html'); return false;" class="hint">👈 ย้อนกลับหน้าแรก</a>
                <a href="#" onclick="goToPage('game.html'); return false;" class="hint">ไปหน้าตารางรูป 👉</a>
            </div>
        </div>
    </div>

    <!-- Popup ถามเมื่อวิดีโอเล่นจบ -->
    <div id="videoPopup" class="popup-overlay">
        <div class="popup-box">
            <h3>ดูจบแล้วน๊าาาาา</h3>
            <p>อยากดูวิดีโออีกรอบ หรือจะเปิดดูหน้าถัดไป</p>
            <div class="popup-btn-group">
                <button id="replayBtn" class="btn-replay">ดูอีกรอบ</button>
                <button id="nextPageBtn" class="btn-next">ไปหน้าถัดไป</button>
            </div>  
        </div>
    </div>

    <script>
        const myVideo = document.getElementById("myVideo");
        const videoPopup = document.getElementById("videoPopup");
        const replayBtn = document.getElementById("replayBtn");
        const nextPageBtn = document.getElementById("nextPageBtn");
        const bookPage = document.getElementById("bookPage");

        // ฟังก์ชันย้ายหน้าพร้อมเลือก Animation ให้เหมาะสม
        function goToPage(url) {
            if (myVideo) myVideo.pause(); // หยุดวิดีโอก่อนเปลี่ยนหน้า
            bookPage.classList.remove("page-enter");

            // 🌟 ถ้ากดกลับไปหน้าแรก (index.html) ให้เล่น Animation พับปิดสมุดย้อนกลับ
            if (url === 'index.html') {
                bookPage.classList.add("page-exit-to-index");
            } else {
                // ถ้าไปหน้าถัดไป (game.html) ให้พลิกไปหน้าถัดไปตามปกติ
                bookPage.classList.add("page-exit");
            }

            // รอเล่น Animation ให้จบเนียนๆ (550ms) แล้วค่อยย้ายหน้า
            setTimeout(() => {
                window.location.href = url;
            }, 550);
        }

        if (myVideo) {
            myVideo.addEventListener("ended", function() {
                if (videoPopup) videoPopup.classList.add("show");
            });
        }

        if (replayBtn) {
            replayBtn.addEventListener("click", function() {
                if (videoPopup) videoPopup.classList.remove("show");
                if (myVideo) {
                    myVideo.currentTime = 0;
                    myVideo.play();
                }
            });
        }

        if (nextPageBtn) {
            nextPageBtn.addEventListener("click", function() {
                if (videoPopup) videoPopup.classList.remove("show");
                goToPage("game.html"); // พลิกเปิดไปหน้า game.html แบบลื่นๆ
            });
        }
    </script>
</body>
</html>
