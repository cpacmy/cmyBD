<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂Card🎂</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' fill='%23ff6b81' viewBox='0 0 16 16'><path d='m7.868 1.258-.2-.35a.5.5 0 0 0-.868 0l-.2.35C6.305 1.782 6 2.296 6 3c0 .828.672 1.5 1.5 1.5S9 3.828 9 3c0-.704-.305-1.218-.601-1.742zM4 6.5A1.5 1.5 0 0 1 5.5 5h5A1.5 1.5 0 0 1 12 6.5V8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6.5z'/><path d='M2 11.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 .5.5v1a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12.5v-1z'/></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="introBook" class="intro-book">
        <h2>To P'Mind 💖</h2>
        <div class="message-box">
            <p>สุขสันต์วันเกิดพี่มายด์ของเค้าน๊าาา วันนี้เป็นวันพิเศษมากๆสำหรับมะม๊าเค้าอยากทำให้มันดีที่สุดเท่าที่เค้าจะทำได้ ขอบคุณมะม๊าที่อยู่กับเค้านะ</p>
        </div>
        <div class="click-hint">กดเลยยยยยยยย 👉</div>
    </div>

    <script>
        const introBook = document.getElementById("introBook");
        
        if (introBook) {
            introBook.addEventListener("click", function() {
                introBook.classList.add("flip-open");
                // เมื่อซูมเปิดสมุดเสร็จ (0.7 วิ) ให้เปลี่ยนไปยังหน้าวิดีโอ (video.html)
                setTimeout(() => {
                    window.location.href = "video.html";
                }, 700);
            });
        }
    </script>
</body>
</html>
