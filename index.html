<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
    <!-- <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' fill='%23ff6b81' viewBox='0 0 16 16'><path d='m7.868 1.258-.2-.35a.5.5 0 0 0-.868 0l-.2.35C6.305 1.782 6 2.296 6 3c0 .828.672 1.5 1.5 1.5S9 3.828 9 3c0-.704-.305-1.218-.601-1.742zM4 6.5A1.5 1.5 0 0 1 5.5 5h5A1.5 1.5 0 0 1 12 6.5V8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6.5z'/><path d='M2 11.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 .5.5v1a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12.5v-1z'/></svg>"> -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- โครงสร้างซองจดหมายขนาดใหญ่พอดีสายตา -->
    <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="envelope" id="envelope">
            <!-- ฝาซองจดหมายด้านบน -->
            <div class="flap"></div>

            <!-- 🌟 เพิ่มตราประทับหัวใจตรงนี้เลย -->
            <div class="heart-seal" id="heartSeal">❤️</div>
            
            <!-- กองแผ่นจดหมายด้านในซอง (สามารถเพิ่มแผ่นจดหมายย่อยๆ เพิ่มได้ตามต้องการ) -->
            <div class="letter-stack">
                <div class="letter-card active-card" onclick="handleCardClick(event, this)">
                    <h2>To P'Mind 💖</h2>
                    <div class="message-box">
                        <p>สุขสันต์วันเกิดพี่มายด์ของเค้าน๊าาา วันนี้เป็นวันพิเศษมากๆสำหรับมะม๊าเค้าอยากทำให้มันดีที่สุดเท่าที่เค้าจะทำได้ ขอบคุณมะม๊าที่ใช้ชีวิตได้อย่างดีมากๆเลยนะ</p>
                    </div>
                    <div class="click-hint"></div>
                </div>
            </div>

            <!-- ตัวซองจดหมายด้านหน้า -->
            <div class="pocket"></div>
        </div>
    </div>

    <script>
        let isOpen = false;
        const envelopeWrapper = document.getElementById("envelopeWrapper");
        const heartSeal = document.getElementById("heartSeal"); // ดึงหัวใจมาใช้งาน

        // กดที่ซองเพื่อเปิด
        envelopeWrapper.addEventListener("click", function(e) {
            if (!isOpen) {
                isOpen = true;
                
                // 1. สั่งให้หัวใจสลายหายไปก่อน
                heartSeal.classList.add("broken");
                
                // 2. หน่วงเวลาให้หัวใจจางหายแป๊บนึง (0.5 วินาที) แล้วค่อยเปิดฝาซอง
                setTimeout(() => {
                    envelopeWrapper.classList.add("open");
                }, 500); 
            }
        });

        // ฟังก์ชันเมื่อกดที่แผ่นจดหมายเพื่อปลิวออกไป
        function handleCardClick(event, card) {
            if (!isOpen) return;
            event.stopPropagation(); // ป้องกันไม่ให้ไปตีกับอีเวนต์เปิดซอง

            // ใส่คลาสปลิวออกไปทางด้านข้าง/ด้านบน
            card.classList.add("fly-away");

            setTimeout(() => {
                card.style.display = "none";
                const remainingCards = document.querySelectorAll(".letter-card:not(.fly-away)");
                
                if (remainingCards.length > 0) {
                    remainingCards[0].classList.add("active-card");
                } else {
                    // เมื่อแผ่นจดหมายหมดแล้ว ให้เปลี่ยนไปหน้า video.html
                    window.location.href = "video.html";
                }
            }, 600);
        }
    </script>
</body>
</html>
